<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostScrapedIn</title>
  <style>
    :root {
      --primary: #0A66C2;
      --primary-hover: #004182;
      --primary-subtle: #e8f3ff;
      --bg: #0F172A;
      --surface: #1E293B;
      --surface-border: #334155;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #38BDF8;
      --success: #10B981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --warning: #F59E0B;
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 440px;
      min-height: 520px;
      max-height: 580px;
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      font-size: 13px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--surface-border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Header */
    header {
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #0A66C2 0%, #0077B5 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(10, 102, 194, 0.4);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #FFFFFF;
    }

    .brand-badge {
      font-size: 10px;
      background: #0284C7;
      color: #fff;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .session-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      box-shadow: 0 0 8px var(--warning);
    }

    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.offline {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    /* Main Container */
    main {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* Alerts */
    .banner {
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      line-height: 1.4;
    }

    .banner.error {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #FCA5A5;
    }

    .banner.error a {
      color: #60A5FA;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 600;
    }

    .banner.hidden {
      display: none;
    }

    /* User Profile Chip */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .profile-name {
      font-weight: 600;
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-headline {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Config Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 10px;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    select {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    /* Primary Fetch Button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 2px 4px rgba(10, 102, 194, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 3px 8px rgba(10, 102, 194, 0.5);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      font-size: 11px;
      padding: 6px 10px;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #334155;
      border-color: #475569;
    }

    .btn-secondary.btn-success {
      border-color: var(--success);
      color: var(--success);
    }

    /* Progress & Live Status */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0A66C2 0%, #38BDF8 100%);
      transition: width 0.3s ease;
      border-radius: 3px;
    }

    .progress-bar.indeterminate {
      width: 40%;
      animation: indeterminate 1.5s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }

    /* Output Section */
    .output-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stats-badge {
      font-size: 11px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      height: 170px;
      background: #0B1120;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      color: #E2E8F0;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      padding: 10px;
      resize: vertical;
      outline: none;
      white-space: pre;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    /* Action bar */
    .action-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* Footer */
    footer {
      padding: 10px 16px;
      background: var(--surface);
      border-top: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .privacy-tag {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #10B981;
      font-weight: 500;
    }

    /* Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-logo" style="padding: 3px; background: transparent; box-shadow: none;">
        <svg viewBox="0 0 128 128" width="28" height="28">
          <rect width="128" height="128" rx="28" fill="#0A66C2"/>
          <path d="M 40 34 L 84 34 L 84 66 L 76 66 L 76 42 L 48 42 L 48 86 L 72 86 L 72 94 L 40 94 Z" fill="#FFFFFF"/>
          <rect x="54" y="50" width="22" height="4" rx="2" fill="#FFFFFF"/>
          <rect x="54" y="60" width="22" height="4" rx="2" fill="#FFFFFF"/>
          <rect x="54" y="70" width="16" height="4" rx="2" fill="#FFFFFF"/>
          <path d="M 84 66 L 92 66 L 92 82 L 99 82 L 88 95 L 77 82 L 84 82 Z" fill="#FFFFFF"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">PostScrapedIn</div>
      </div>
      <span class="brand-badge">v1.0</span>
    </div>
    <div class="session-status">
      <span id="statusDot" class="status-dot"></span>
      <span id="sessionStatusText">Checking session...</span>
    </div>
  </header>

  <main>
    <!-- Unauthenticated Banner -->
    <div id="authErrorBanner" class="banner error hidden">
      <div>⚠️</div>
      <div>
        <strong>Not logged in:</strong> Active LinkedIn session not found. Please 
        <a id="loginLink" href="https://www.linkedin.com/login" target="_blank">open LinkedIn and log in</a>, then reopen this popup.
      </div>
    </div>

    <!-- Verified Profile Card -->
    <div id="profileCard" class="profile-card">
      <div class="profile-info">
        <div id="profileName" class="profile-name">Connecting to LinkedIn...</div>
        <div id="profileHeadline" class="profile-headline">Fetching verified user identity...</div>
      </div>
      <div id="postCountBadge" class="stats-badge">0 Posts</div>
    </div>

    <!-- Controls Row -->
    <div class="controls-grid" style="grid-template-columns: 1fr 1fr 1fr;">
      <div class="form-group">
        <label for="postType">Scope</label>
        <select id="postType">
          <option value="posts" selected>My Posts Only</option>
          <option value="shares">Shares & Articles</option>
          <option value="all">All Activity</option>
        </select>
      </div>

      <div class="form-group">
        <label for="postLimit">Max Count</label>
        <select id="postLimit">
          <option value="25">25 posts</option>
          <option value="50">50 posts</option>
          <option value="100" selected>100 posts</option>
          <option value="250">250 posts</option>
          <option value="500">500 posts</option>
          <option value="9999">All available</option>
        </select>
      </div>

      <button id="fetchBtn" class="btn btn-primary" disabled style="height: 34px;">
        <span id="fetchBtnSpinner" class="spinner" style="display: none;"></span>
        <span id="fetchBtnText">Fetch Posts</span>
      </button>
    </div>

    <!-- Progress section -->
    <div id="progressSection" class="progress-section">
      <div class="progress-header">
        <span id="progressMessage">Ready to fetch</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <!-- Output Textarea -->
    <div class="output-section">
      <div class="output-header">
        <label for="outputArea">Extracted Posts Output</label>
        <span id="charCount" style="font-size: 11px; color: var(--text-muted);">0 chars</span>
      </div>
      <textarea id="outputArea" placeholder="Click 'Fetch Posts' to extract your published LinkedIn posts..." readonly></textarea>
    </div>

    <!-- Export Action Row -->
    <div class="action-row">
      <button id="copyBtn" class="btn btn-secondary" disabled>📋 Copy</button>
      <button id="downloadTxtBtn" class="btn btn-secondary" disabled>📄 .txt</button>
      <button id="downloadJsonBtn" class="btn btn-secondary" disabled>📦 .json</button>
      <button id="clearBtn" class="btn btn-secondary" disabled>✕ Clear</button>
    </div>
  </main>

  <footer>
    <div class="privacy-tag">
      <span>🔒</span> 100% Offline & Client-side
    </div>
    <span style="font-size: 10px;">Throttled to avoid 429</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
